<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicode BMP Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  #canvas, #char-canvas {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
  }
  #canvas {
    cursor: grab;
  }
  #canvas:active { cursor: grabbing; }
  /* The character cache canvas sits on top of the main canvas and only ever
     draws unicode glyphs, composited from cached per-tile bitmaps. It never
     receives pointer events itself -- all panning/zooming/hover happens on
     the main canvas underneath. */
  #char-canvas {
    pointer-events: none;
  }
  /* Info panel in top-left corner */
  #info {
    position: fixed;
    top: 12px;
    left: 12px;
    background: rgba(20, 20, 40, 0.9);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    max-width: 320px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #info .label { color: #888; }
  #info .value { color: #fff; font-weight: 500; }
  /* Hover tooltip */
  #tooltip {
    position: fixed;
    background: rgba(20, 20, 40, 0.95);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    backdrop-filter: blur(8px);
    z-index: 100;
  }

  /* Color legend */
  #legend {
    position: fixed;
    bottom: 12px;
    left: 12px;
    background: rgba(20, 20, 40, 0.9);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 11px;
    backdrop-filter: blur(8px);
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    pointer-events: auto;
  }
  #legend h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin-bottom: 8px;
  }
  #legend .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
    cursor: default;
  }
  #legend .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  #legend .legend-label {
    color: #ccc;
    white-space: nowrap;
  }

  /* Instructions */
  #help {
    position: fixed;
    bottom: 12px;
    right: 12px;
    background: rgba(20, 20, 40, 0.8);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: #888;
    backdrop-filter: blur(8px);
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<canvas id="char-canvas"></canvas>

<div id="tooltip"></div>

<div id="info">
  <div><span class="label">Zoom: </span><span class="value" id="zoom-level">1.0x</span></div>
  <div><span class="label">View: </span><span class="value" id="view-mode">Block Overview</span></div>
  <div><span class="label">Category: </span><span class="value" id="hover-category">—</span></div>
  <div><span class="label">Block: </span><span class="value" id="hover-block">—</span></div>
  <div><span class="label">Block Range: </span><span class="value" id="hover-block-range">—</span></div>
</div>

<div id="legend"></div>

<div id="help">
  Scroll to zoom · Drag to pan · Hover for details
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="./blocks.js"></script>
<script>

// =============================================================================
// Color palette for script families (grouped by category)
// =============================================================================
const CATEGORY_COLORS = {
  "Latin":       "#4a9eff",
  "Greek":       "#7c6cf0",
  "Cyrillic":    "#9b59b6",
  "Armenian":    "#e67e22",
  "Hebrew":      "#f39c12",
  "Arabic":      "#e74c3c",
  "Syriac":      "#c0392b",
  "Indic":       "#2ecc71",
  "Thai":        "#1abc9c",
  "Tibetan":     "#16a085",
  "Myanmar":     "#27ae60",
  "Georgian":    "#d35400",
  "Hangul":      "#fd79a8",
  "Ethiopic":    "#a29bfe",
  "Canadian":    "#00b894",
  "Khmer":       "#00cec9",
  "Mongolian":   "#fdcb6e",
  "CJK":         "#ff6b6b",
  "Yi":          "#ffa502",
  "Symbols":     "#74b9ff",
  "Punctuation": "#636e72",
  "Other":       "#55efc4",
  "Surrogate":   "#2d3436",
  "Private":     "#636e72",
};

// Map blocks to categories for coloring
function getBlockCategory(name) {
  const n = name.toLowerCase();
  if (n.includes("latin") || n.includes("ipa") || n.includes("spacing modifier") || n.includes("phonetic")) return "Latin";
  if (n.includes("greek")) return "Greek";
  if (n.includes("cyrillic")) return "Cyrillic";
  if (n.includes("armenian")) return "Armenian";
  if (n.includes("hebrew")) return "Hebrew";
  if (n.includes("arabic")) return "Arabic";
  if (n.includes("syriac") || n.includes("thaana") || n.includes("nko") || n.includes("samaritan") || n.includes("mandaic")) return "Syriac";
  if (n.includes("devanagari") || n.includes("bengali") || n.includes("gurmukhi") || n.includes("gujarati") ||
      n.includes("oriya") || n.includes("tamil") || n.includes("telugu") || n.includes("kannada") ||
      n.includes("malayalam") || n.includes("sinhala") || n.includes("vedic") || n.includes("syloti") ||
      n.includes("saurashtra") || n.includes("kayah") || n.includes("rejang") || n.includes("javanese") ||
      n.includes("balinese") || n.includes("sundanese") || n.includes("batak") || n.includes("lepcha") ||
      n.includes("ol chiki") || n.includes("phags")) return "Indic";
  if (n.includes("thai") || n.includes("lao") || n.includes("tai") || n.includes("khmer symbol")) return "Thai";
  if (n.includes("tibetan")) return "Tibetan";
  if (n.includes("myanmar")) return "Myanmar";
  if (n.includes("georgian")) return "Georgian";
  if (n.includes("hangul")) return "Hangul";
  if (n.includes("ethiopic")) return "Ethiopic";
  if (n.includes("canadian")) return "Canadian";
  if (n.includes("khmer")) return "Khmer";
  if (n.includes("mongolian")) return "Mongolian";
  if (n.includes("cjk") || n.includes("hiragana") || n.includes("katakana") || n.includes("bopomofo") ||
      n.includes("kangxi") || n.includes("ideograph") || n.includes("kanbun") || n.includes("yijing")) return "CJK";
  if (n.includes("yi ")) return "Yi";
  if (n.includes("surrogate")) return "Surrogate";
  if (n.includes("private")) return "Private";
  if (n.includes("symbol") || n.includes("arrow") || n.includes("operator") || n.includes("braille") ||
      n.includes("box draw") || n.includes("block elem") || n.includes("geometric") || n.includes("dingbat") ||
      n.includes("enclosed") || n.includes("currency") || n.includes("letterlike") || n.includes("number form") ||
      n.includes("control pic") || n.includes("optical") || n.includes("miscellaneous")) return "Symbols";
  if (n.includes("punctuation") || n.includes("combining") || n.includes("variation") || n.includes("half mark") ||
      n.includes("form") || n.includes("specials") || n.includes("halfwidth") || n.includes("fullwidth")) return "Punctuation";
  return "Other";
}

// =============================================================================
// Main visualization
// =============================================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Overlay canvas dedicated to rendering unicode glyphs from the tile cache.
// Kept separate from the main canvas so glyph rendering (relatively expensive,
// and the thing we want to cache/upgrade progressively) never has to be
// redone just because the background/borders/labels need a redraw.
const charCanvas = document.getElementById("char-canvas");
const cctx = charCanvas.getContext("2d");

const FONT = "-apple-system, BlinkMacSystemFont, 'Noto Sans', sans-serif";

// Grid dimensions: 256 columns × 256 rows = 65536 codepoints (the full BMP)
const GRID_COLS = 256;
const GRID_ROWS = 256;
const CELL_SIZE = 4; // base cell size in "world" pixels

// Zoom min thresholds
const LEVEL_BLOCK_LABELS = 3;
const LEVEL_CHARACTER_GRID = 5;
const LEVEL_CHARACTER = 6;

let width, height;
let transform = d3.zoomIdentity;

// Resize canvas to fill viewport
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * devicePixelRatio;
  canvas.height = height * devicePixelRatio;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  charCanvas.width = width * devicePixelRatio;
  charCanvas.height = height * devicePixelRatio;
  charCanvas.style.width = width + "px";
  charCanvas.style.height = height + "px";
  cctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  render();
}

// Precompute block lookup: for each codepoint, which block index?
const blockIndex = new Uint8Array(65536);
blockIndex.fill(255); // 255 = no block
for (let i = 0; i < BLOCKS.length; i++) {
  const [start, end] = BLOCKS[i];
  blockIndex.fill(i, start, end)
}

// Precompute block colors and category names
const blockCategories = BLOCKS.map(([, , name]) => getBlockCategory(name));
const blockColors = blockCategories.map(cat =>
  CATEGORY_COLORS[cat] || CATEGORY_COLORS["Other"]
);

// Build the color legend in the DOM
(function buildLegend() {
  const legendEl = document.getElementById("legend");
  let html = '<h3>Categories</h3>';
  for (const [cat, color] of Object.entries(CATEGORY_COLORS)) {
    if (!color) continue;
    html += `<div class="legend-item">
      <div class="legend-swatch" style="background:${color}"></div>
      <span class="legend-label">${cat}</span>
    </div>`;
  }
  legendEl.innerHTML = html;
})();

// Precompute category regions for drawing big category labels when zoomed out.
// Group contiguous blocks of the same category and compute their bounding box.
const categoryRegions = [];
(function computeCategoryRegions() {
  let currentCat = null;
  let regionStart = 0;
  for (let i = 0; i <= BLOCKS.length; i++) {
    const cat = i < BLOCKS.length ? blockCategories[i] : null;
    if (cat !== currentCat) {
      if (currentCat !== null) {
        // Close previous region
        const startCp = BLOCKS[regionStart][0];
        const endCp = BLOCKS[i - 1][1];
        categoryRegions.push({
          category: currentCat,
          startCp,
          endCp,
          startRow: Math.floor(startCp / GRID_COLS),
          endRow: Math.floor(endCp / GRID_COLS),
          color: CATEGORY_COLORS[currentCat] || CATEGORY_COLORS["Other"]
        });
      }
      currentCat = cat;
      regionStart = i;
    }
  }
})();

// Darken a hex color
function darken(hex, amount) {
  const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
  const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
  const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
  return `rgb(${r},${g},${b})`;
}

// Convert hex color to rgba
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}


// Convert a decimal codepoint to a Unicode U+XXXX codepoint
const hexCp = (cp) => "U+" + cp.toString(16).toUpperCase().padStart(4, '0');

// =============================================================================
// Character tile cache
//
// Glyph rendering is the most expensive part of each frame, so instead of
// drawing every visible character straight into the frame (like the old
// renderCharacters() did), we render characters into small offscreen
// "tile" canvases -- TILE_CELLS x TILE_CELLS codepoints each -- and cache
// those tiles keyed by their grid position. The tile cache conceptually
// spans the *entire* 256x256 BMP grid (65536 codepoints), far more than
// what's ever on screen at once; only tiles that have actually been
// requested get rendered and kept around, so panning back to a
// previously-visited area is instant (no re-render needed).
//
// Each tile is rendered at one of a handful of resolution "buckets"
// (pixels-per-codepoint-cell). When the current zoom level calls for a
// higher-resolution bucket than what's cached, we queue a re-render of
// that tile at the new resolution rather than blocking the current frame.
// Until the higher-res version is ready, we keep compositing the old
// (blurrier) tile, so zooming in shows a brief "sharpening" as fresh tiles
// land, rather than either blocking or flashing to blank.
// =============================================================================

const TILE_CELLS = 8;                     // codepoints per tile edge (8x8 = 64 chars/tile)
const TILE_COLS = GRID_COLS / TILE_CELLS; // 32
const TILE_ROWS = GRID_ROWS / TILE_CELLS; // 32

// Resolution buckets, in device pixels per grid cell. Rendering snaps up to
// the nearest bucket so that small zoom changes don't constantly invalidate
// tiles -- a tile stays "good enough" across a range of zoom levels before
// it needs a re-render. The top bucket also caps how large tile canvases
// (and thus memory) can get at extreme zoom.
const QUALITY_BUCKETS = [16, 32, 64, 128, 256];

function requiredCellPx(cellScreen) {
  const target = cellScreen * devicePixelRatio;
  for (const bucket of QUALITY_BUCKETS) {
    if (bucket >= target) return bucket;
  }
  return QUALITY_BUCKETS[QUALITY_BUCKETS.length - 1];
}

const tileCache = new Map(); // "tr,tc" -> { canvas, cellPx, queued }
const MAX_CACHED_TILES = 500; // soft memory cap; oldest-touched tiles are evicted first
const renderQueue = [];
let queueScheduled = false;

function tileKey(tr, tc) {
  return tr + "," + tc;
}

// Render one tile at the given resolution (cellPx = device pixels per cell)
// into a fresh offscreen canvas, and store it in the cache.
function renderTile(tr, tc, cellPx) {
  const size = TILE_CELLS * cellPx;
  const off = document.createElement("canvas");
  off.width = size;
  off.height = size;
  const octx = off.getContext("2d");

  // Character size scales directly off the resolution we're rendering at,
  // with no upper cap -- this is what keeps glyph size consistent relative
  // to the grid cell at every zoom level (the old fixed 40px cap made
  // characters look tiny relative to their cell once zoomed in far).
  const charSize = cellPx * 0.65;
  octx.font = `${charSize}px ${FONT}`;
  octx.textAlign = "center";
  octx.textBaseline = "middle";

  const rowBase = tr * TILE_CELLS;
  const colBase = tc * TILE_CELLS;

  for (let dr = 0; dr < TILE_CELLS; dr++) {
    for (let dc = 0; dc < TILE_CELLS; dc++) {
      const row = rowBase + dr;
      const col = colBase + dc;
      const cp = row * GRID_COLS + col;
      if (cp > 0xFFFF) continue;

      const bi = blockIndex[cp];
      if (bi === 255) continue;
      const blockName = BLOCKS[bi][2];
      if (blockName.includes("Surrogate")) continue;

      // Skip C0/C1 control characters
      if (cp < 0x20 || (cp >= 0x7F && cp <= 0x9F)) continue;

      try {
        const char = String.fromCodePoint(cp);
        octx.fillStyle = hexToRgba(blockColors[bi], 0.9);
        octx.fillText(char, dc * cellPx + cellPx / 2, dr * cellPx + cellPx / 2);
      } catch (e) {
        // Skip invalid codepoints
      }
    }
  }

  tileCache.set(tileKey(tr, tc), { canvas: off, cellPx });
  evictStaleTilesIfNeeded();
}

// Simple insertion-order-based LRU: touching a tile moves it to the end of
// the Map, so the oldest untouched tiles end up at the front and get
// evicted first once we're over the cap.
function touchTile(key) {
  const entry = tileCache.get(key);
  if (entry) {
    tileCache.delete(key);
    tileCache.set(key, entry);
  }
}

function evictStaleTilesIfNeeded() {
  while (tileCache.size > MAX_CACHED_TILES) {
    const oldestKey = tileCache.keys().next().value;
    tileCache.delete(oldestKey);
  }
}

// Make sure a tile is cached at >= the requested quality. If it's missing
// or stale, queue a (re)render rather than rendering synchronously, so a
// burst of newly-visible tiles (e.g. from a fast zoom) doesn't stall a frame.
function ensureTile(tr, tc, cellPx) {
  const key = tileKey(tr, tc);
  const entry = tileCache.get(key);
  if (entry && entry.cellPx >= cellPx) return;       // already good enough
  if (entry && entry.queued >= cellPx) return;        // already queued at >= this quality

  renderQueue.push({ tr, tc, cellPx });
  if (entry) entry.queued = cellPx;
  scheduleQueue();
}

function scheduleQueue() {
  if (queueScheduled) return;
  queueScheduled = true;
  requestAnimationFrame(processQueue);
}

function processQueue() {
  queueScheduled = false;
  const BATCH_SIZE = 6; // render a few tiles per frame so panning/zooming stays smooth
  let processed = 0;
  while (renderQueue.length && processed < BATCH_SIZE) {
    const { tr, tc, cellPx } = renderQueue.shift();
    renderTile(tr, tc, cellPx);
    processed++;
  }
  if (renderQueue.length) {
    scheduleQueue();
  }
  // Newly-rendered tiles need to be composited even if the user has stopped
  // panning/zooming (no pending d3 zoom event would otherwise trigger this).
  drawCharOverlay();
}

// Composite all currently-visible tiles onto the char-canvas overlay at the
// current transform, upgrading tile quality on demand via ensureTile().
function drawCharOverlay() {
  cctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cctx.clearRect(0, 0, width, height);

  const k = transform.k;
  const cellScreen = CELL_SIZE * k;
  if (cellScreen < LEVEL_CHARACTER) return; // not zoomed in enough to show glyphs at all

  const tx = transform.x, ty = transform.y;
  const calcx = (col) => col * CELL_SIZE * k + tx;
  const calcy = (row) => row * CELL_SIZE * k + ty;

  const worldLeft = -tx / k;
  const worldTop = -ty / k;
  const worldRight = (width - tx) / k;
  const worldBottom = (height - ty) / k;

  const colStart = Math.max(0, Math.floor(worldLeft / CELL_SIZE));
  const colEnd = Math.min(GRID_COLS - 1, Math.ceil(worldRight / CELL_SIZE));
  const rowStart = Math.max(0, Math.floor(worldTop / CELL_SIZE));
  const rowEnd = Math.min(GRID_ROWS - 1, Math.ceil(worldBottom / CELL_SIZE));

  const tileColStart = Math.max(0, Math.floor(colStart / TILE_CELLS));
  const tileColEnd = Math.min(TILE_COLS - 1, Math.floor(colEnd / TILE_CELLS));
  const tileRowStart = Math.max(0, Math.floor(rowStart / TILE_CELLS));
  const tileRowEnd = Math.min(TILE_ROWS - 1, Math.floor(rowEnd / TILE_CELLS));

  const desiredCellPx = requiredCellPx(cellScreen);

  for (let tr = tileRowStart; tr <= tileRowEnd; tr++) {
    for (let tc = tileColStart; tc <= tileColEnd; tc++) {
      const key = tileKey(tr, tc);
      ensureTile(tr, tc, desiredCellPx);

      const entry = tileCache.get(key);
      if (!entry) continue; // nothing rendered yet for this tile -- it'll appear once the queue catches up

      touchTile(key);

      const worldRow = tr * TILE_CELLS;
      const worldCol = tc * TILE_CELLS;
      const sx = calcx(worldCol);
      const sy = calcy(worldRow);
      const sSize = TILE_CELLS * CELL_SIZE * k;

      cctx.drawImage(entry.canvas, sx, sy, sSize, sSize);
    }
  }
}

// =============================================================================
// Rendering with semantic zoom
// =============================================================================
function render() {
  const k = transform.k;
  const tx = transform.x;
  const ty = transform.y;

  const calcx = (col) => col * CELL_SIZE * k + tx;
  const calcy = (row) => row * CELL_SIZE * k + ty;

  ctx.save();
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = "#1a1a2e";
  ctx.fillRect(0, 0, width, height);

  // Determine visible area in world coordinates
  const worldLeft = -tx / k;
  const worldTop = -ty / k;
  const worldRight = (width - tx) / k;
  const worldBottom = (height - ty) / k;

  // Grid cell range that's visible
  const colStart = Math.max(0, Math.floor(worldLeft / CELL_SIZE));
  const colEnd = Math.min(GRID_COLS - 1, Math.ceil(worldRight / CELL_SIZE));
  const rowStart = Math.max(0, Math.floor(worldTop / CELL_SIZE));
  const rowEnd = Math.min(GRID_ROWS - 1, Math.ceil(worldBottom / CELL_SIZE));

  const cellScreen = CELL_SIZE * k; // cell size on screen

  // Update view mode indicator
  const zoomEl = document.getElementById("zoom-level");
  const viewEl = document.getElementById("view-mode");
  zoomEl.textContent = k.toFixed(1) + "x";

  if (cellScreen >= LEVEL_CHARACTER ) {
    viewEl.textContent = "Character View";
  } else if (cellScreen >= LEVEL_BLOCK_LABELS) {
    viewEl.textContent = "Block Details";
  } else {
    viewEl.textContent = "Block Overview";
  }

  // --- LEVEL 1: Render blocks as colored rectangles (always drawn) ---
  function renderBlocks() {
    for (let i = 0; i < BLOCKS.length; i++) {
      const [start, end, name] = BLOCKS[i];
      const startRow = Math.floor(start / GRID_COLS);
      const startCol = start % GRID_COLS;
      const endRow = Math.floor(end / GRID_COLS);
      const endCol = end % GRID_COLS;

      // Check if block is visible
      if (endRow < rowStart || startRow > rowEnd) continue;

      const color = blockColors[i];

      function drawRect(startCol, endCol, startRow, endRow) {
        const sx = calcx(startCol);
        const sy = calcy(startRow);
        const sw = (endCol - startCol + 1) * CELL_SIZE * k;
        const sh = (endRow - startRow + 1) * CELL_SIZE * k;
        ctx.fillStyle = hexToRgba(color, 0.7);
        ctx.fillRect(sx, sy, sw, sh);
      }

      if (startRow === endRow) {
        // Single row block
        drawRect(startCol, endCol, startRow, endRow);
      } else {
        // Multi-row blocks: most blocks start at col 0 and end at 255, and thus span one large rectangle
        // from start to end. However, some blocks (e.g. Hangul, Ethiopic) occupy partial first/last rows
        if (startCol === 0 && endCol === GRID_COLS-1) {
          drawRect(startCol, endCol, startRow, endRow);
        } else {
          // Draw first partial row
          drawRect(startCol, GRID_COLS-1, startRow, startRow);

          // Draw middle full rows
          drawRect(0, GRID_COLS-1, startRow+1, endRow-1);

          // Draw last partial row
          drawRect(startCol, endCol, endRow, endRow);
        }
      }
    }
  }
  renderBlocks();

  function renderCategoryLabels() {
    for (const region of categoryRegions) {
      const { category, startRow, endRow, color } = region;
      const regionHeight = (endRow - startRow + 1) * CELL_SIZE * k;
      if (regionHeight < 12) continue;

      const ry = calcy(startRow);
      if (ry > height || ry + regionHeight < 0) continue;

      const midY = calcy((startRow + endRow) / 2);
      const midX = calcx(128);

      const fontSize = Math.min(Math.max(regionHeight * 0.4, 10) * k, 28);
      ctx.font = `bold ${fontSize}px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const metrics = ctx.measureText(category);
      const pad = 4;
      ctx.fillStyle = "rgba(10,10,30,0.6)";
      ctx.fillRect(midX - metrics.width / 2 - pad, midY - fontSize / 2 - pad,
                   metrics.width + pad * 2, fontSize + pad * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.95;
      ctx.fillText(category, midX, midY);
      ctx.globalAlpha = 1.0;
    }
  }

  if (cellScreen < LEVEL_CHARACTER) {
    renderCategoryLabels();
  }

  // --- LEVEL 2: Render block borders and labels (when zoomed enough to see them) ---
  function renderBlockOutline(renderLabel) {
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 1;

    const fontSize = Math.min(Math.max(cellScreen * 1.5, 9), 16);
    ctx.font = `bold ${fontSize}px ${FONT}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    for (let i = 0; i < BLOCKS.length; i++) {
      const [start, end, name] = BLOCKS[i];
      const startRow = Math.floor(start / GRID_COLS);
      const endRow = Math.floor(end / GRID_COLS);
      if (endRow < rowStart || startRow > rowEnd) continue;

      const startCol = start % GRID_COLS;
      const endCol = end % GRID_COLS;

      // Draw border around block
      if (startCol === 0 && endCol === 255) {
        const sx = calcx(0);
        const sy = calcy(startRow);
        const sw = 256 * CELL_SIZE * k;
        const sh = (endRow - startRow + 1) * CELL_SIZE * k;
        ctx.strokeRect(sx, sy, sw, sh);
      } else if (startRow === endRow) {
        const sx = calcx(startCol);
        const sy = calcy(startRow);
        const sw = (endCol - startCol + 1) * CELL_SIZE * k;
        const sh = CELL_SIZE * k;
        ctx.strokeRect(sx, sy, sw, sh);
      }

      if (renderLabel) {
        const midRow = (startRow + endRow) / 2;

        const lx = calcx(startCol === 0 ? 2 : startCol) + 4;
        const ly = calcy(midRow) + 2;

        // Only draw if label fits on screen
        if (lx > -200 && lx < width + 200 && ly > -50 && ly < height + 50) {
          // Background for readability
          const metrics = ctx.measureText(name);
          const labelH = fontSize + 4;
          ctx.fillStyle = "rgba(20,20,40,0.75)";
          ctx.fillRect(lx - 2, ly - 1, metrics.width + 6, labelH);
          ctx.fillStyle = "#fff";
          ctx.fillText(name, lx, ly);
        }
      }
    }
  }

  renderBlockOutline(cellScreen >= LEVEL_BLOCK_LABELS);

  // --- LEVEL 3: Individual character grid ---
  function renderCharGrid() {
    // Draw grid lines
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    for (let col = colStart; col <= colEnd + 1; col++) {
      const x = calcx(col);
      ctx.moveTo(x, calcy(rowStart));
      ctx.lineTo(x, calcy(rowEnd + 1));
    }
    for (let row = rowStart; row <= rowEnd + 1; row++) {
      const y = calcy(row);
      ctx.moveTo(calcx(colStart), y);
      ctx.lineTo(calcx(colEnd + 1), y);
    }
    ctx.stroke();
  }

  if (cellScreen >= LEVEL_CHARACTER_GRID) {
    renderCharGrid();
  }

  // --- Draw hex row/col indicators ---
  function renderHexRowColIndicators() {
    const indicatorSize = Math.max(8, Math.min(11, cellScreen * 0.5));
    ctx.font = `${indicatorSize}px monospace`;
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";

    // Column headers (every 16)
    for (let col = Math.floor(colStart / 16) * 16; col <= colEnd; col += 16) {
      const x = calcx(col + 8);
      const y = calcy(rowStart) - 2;
      if (x > 0 && x < width) {
        ctx.fillText(col.toString(16).toUpperCase().padStart(2, '0'), x, y);
      }
    }
  }
  renderHexRowColIndicators();

  ctx.restore();

  // Individual unicode glyphs are drawn on the separate overlay canvas,
  // composited from the tile cache (see "Character tile cache" above).
  drawCharOverlay();
}

// =============================================================================
// Hover logic
// =============================================================================
let mouseX = 0, mouseY = 0;

canvas.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  updateHover(e.clientX, e.clientY);
});

canvas.addEventListener("mouseleave", () => {
  hideTooltip();
  clearHover();
});

function hideTooltip() {
  document.getElementById("tooltip").style.display = "none";
}

function updateHoverText(blockName, category, blockRange) {
  document.getElementById("hover-block").textContent = blockName;
  document.getElementById("hover-category").textContent = category;
  document.getElementById("hover-block-range").textContent = blockRange;
}

function clearHover() {
  updateHoverText("-", "-", "-")
}

function updateHover(px, py) {
  // Convert screen to world
  const worldX = (px - transform.x) / transform.k;
  const worldY = (py - transform.y) / transform.k;
  const col = Math.floor(worldX / CELL_SIZE);
  const row = Math.floor(worldY / CELL_SIZE);

  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) {
    hideTooltip();
    clearHover();
    return;
  }

  const cp = row * GRID_COLS + col;
  const bi = blockIndex[cp];
  const block = bi < 255 ? BLOCKS[bi] : null;
  const blockName = bi < 255 ? block[2] : "No Block";
  const category = bi < 255 ? blockCategories[bi] : "—";

  const blockRange = bi < 255 ? `${hexCp(block[0])}-${hexCp(block[1])}` : "—";
  updateHoverText(blockName, category, blockRange)

  updateTooltip(px, py, cp, blockName);
}

function updateTooltip(px, py, cp, blockName) {
  const tooltip = document.getElementById("tooltip");

  // Show tooltip with character info when zoomed in enough
  const cellScreen = CELL_SIZE * transform.k;
  if (cellScreen < LEVEL_CHARACTER_GRID) {
    tooltip.style.display = "none";
    return;
  }

  const hex = hexCp(cp);
  let char = "";
  try { char = String.fromCodePoint(cp); } catch(e) {}

  const isSurrogate = (cp >= 0xD800 && cp <= 0xDFFF);
  const isControl = cp < 0x20 || (cp >= 0x7F && cp <= 0x9F);

  let display = "";
  if (isSurrogate) {
    display = `<span style="color:#888">U+${hex}</span> — ${blockName}<br><span style="color:#666">(Surrogate, not a character)</span>`;
  } else if (isControl) {
    display = `<span style="color:#888">U+${hex}</span> — ${blockName}<br><span style="color:#666">(Control character)</span>`;
  } else {
    display = `<span class="char">${char}</span> <span style="color:#888">U+${hex}</span><br>${blockName}`;
  }

  tooltip.innerHTML = display;
  tooltip.style.display = "block";
  tooltip.style.left = (px + 16) + "px";
  tooltip.style.top = (py - 10) + "px";

  // Keep tooltip on screen
  const rect = tooltip.getBoundingClientRect();
  if (rect.right > width) {
    tooltip.style.left = (px - rect.width - 10) + "px";
  }
  if (rect.bottom > height) {
    tooltip.style.top = (py - rect.height - 10) + "px";
  }
}

// =============================================================================
// D3 Zoom setup
// =============================================================================
const zoom = d3.zoom()
  .scaleExtent([null, 300])  // from zoomed out to see individual chars
  .on("zoom", (event) => {
    transform = event.transform;
    render();
    updateHover(mouseX, mouseY);
  });

// Set initial transform: fit the whole BMP grid in the viewport
function setInitialView() {
  const gridWidth = GRID_COLS * CELL_SIZE;
  const gridHeight = GRID_ROWS * CELL_SIZE;
  const scaleX = width / gridWidth;
  const scaleY = height / gridHeight;
  const scale = Math.min(scaleX, scaleY) * 0.9;
  const offsetX = (width - gridWidth * scale) / 2;
  const offsetY = (height - gridHeight * scale) / 2;

  transform = d3.zoomIdentity.translate(offsetX, offsetY).scale(scale);
  d3.select(canvas).call(zoom.transform, transform);
}

d3.select(canvas).call(zoom);

// =============================================================================
// Initialize
// =============================================================================
window.addEventListener("resize", resize);
resize();
setInitialView();
</script>
</body>
